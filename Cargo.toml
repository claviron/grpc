[package]
name = "claviron-grpc"
version = "0.2.0-alpha.25"
publish = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/claviron/grpc"
homepage = "https://github.com/claviron/grpc"
description = "Typed mTLS-secured administration services for Claviron"
documentation = "https://docs.rs/claviron-grpc"
keywords = ["grpc", "mtls", "claviron"]
categories = ["network-programming", "asynchronous"]
edition = "2024"
autotests = false
include = ["src/**", "proto/*.proto", "build.rs", "Cargo.toml", "README.md", "LICENSE-*"]

# ─────────────────────────────────────────────────────────────────────
# Features
# ─────────────────────────────────────────────────────────────────────
# `server` pulls in Edge ingress, config parsing,
# DB ORM, certificate handling, and optional service packages the
# gRPC services need.
#
# Default feature set is empty so a downstream consumer must opt in;
# avoids accidentally compiling the heavy server tree into consumers that
# only need generated proto types.
[features]
default = []
server = [
    "tonic/router",
    # Claviron services use the public facade.
    "dep:claviron",
    "claviron/edge",
    "claviron/tls",
    "claviron/hosting",
    "claviron/auth",
    "claviron-acme?/server",
    # HTTP adapter
    "dep:http",
    "dep:http-body-util",
    "dep:futures-util",
    "dep:tower",
    "dep:thiserror",
    "dep:tokio",
    "dep:async-trait",
    "dep:serde",
    "dep:tracing",
    # reflection / cert handling
    "dep:tonic-reflection",
    "dep:time",
]
tasks = ["claviron/tasks"]
users = ["server", "claviron/users", "dep:serde_json"]
authorization = ["server", "claviron/authorization", "dep:serde_json"]
registration = ["mtls-manager", "dep:base64ct", "dep:serde_json"]
workers = ["server"]
metrics = ["server", "claviron/metrics"]
dns = ["server", "dep:claviron-dns"]
domains = ["server", "dep:claviron-domains"]
certificate-manager = ["server", "claviron/tls"]
mtls-manager = ["server", "claviron/tls"]
mtls = ["mtls-manager"]
certificates = ["certificate-manager"]

acme = [
    "dep:claviron-acme",
    "claviron-acme/db",
]

# ─────────────────────────────────────────────────────────────────────
# Dependencies
# ─────────────────────────────────────────────────────────────────────
# Layout:
#   - Proto/codegen dependencies are always compiled so server modules can use
#     generated message and service types.
#   - Server-only dependencies are gated by `server`.

[dependencies]
# ── Proto / shared server dependencies ───────────────────────────────
claviron = { version = "0.2.0-alpha.25", default-features = false, optional = true }
# ── Server-only (gated by `server` feature) ──────────────────────────
claviron-acme = { version = "0.2.0-alpha.25", optional = true }
claviron-dns = { version = "0.2.0-alpha.25.1", default-features = false, features = ["service"], optional = true }
claviron-domains = { version = "0.2.0-alpha.25", default-features = false, features = ["godaddy", "namecheap"], optional = true }

tokio = { version = "1", optional = true, features = ["rt"] }
async-trait = { version = "0.1", optional = true }

tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"


serde = { version = "1", optional = true, features = ["derive", "rc"] }
serde_json = { version = "1.0", optional = true }
base64ct = { version = "1.8", optional = true, features = ["alloc"] }
tracing = { version = "0.1", optional = true }
thiserror = { version = "2.0", optional = true }

# HTTP adapter
http = { version = "1.5", optional = true }
http-body-util = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }

# reflection / cert handling
tonic-reflection = { version = "0.14", optional = true }
time = { version = "0.3", optional = true, features = ["serde", "macros", "formatting", "parsing"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
claviron = { version = "0.2.0-alpha.25", default-features = false, features = ["sqlite"] }
serde_yaml = "0.9"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "time", "sqlite"] }
